      methodology:
        approach: quantitative
        summary: >-
          The dissertation will primarily use Monte Carlo simulation to study the consequences of
          graph-digitization error in single-case experimental design data. Simulated SCED data will
          be generated under known conditions, plotted, and then digitized so that recovered values
          can be compared with the true underlying values. The study will quantify digitization
          error and examine how that error affects effect size estimates and downstream
          meta-analytic conclusions.


          An initial validation stage will evaluate the digitization process and help determine
          realistic error characteristics. Depending on the validation results, an empirical
          component involving human digitizers may also be incorporated so that the simulation
          reflects observed digitization behavior. The simulation design and specific factors are
          still being refined.
