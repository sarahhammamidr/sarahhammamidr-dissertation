    thesis:
      workingTitle: >-
        The Impact of Graph Digitization Error on Effect Size Estimation and Meta-Analytic
        Conclusions in Single-Case Experimental Design Research
      workingSubtitle: ""
      researchQuestion: >-
        Primary question: Under what conditions does graph digitization error meaningfully affect
        effect size estimates and substantive conclusions in single-case experimental design
        research?


        Secondary question: How does digitization error propagate from extracted data points to
        study-level effect estimates and, ultimately, to meta-analytic conclusions?
      background: >-
        My dissertation grew out of my broader interest in validity, measurement, and methodological
        decision-making, particularly in contexts where seemingly small analytic or data-processing
        choices can affect substantive conclusions. Through my work with single-case experimental
        design research, I became interested in a practical but underexamined step in the research
        process: extracting numerical data from published graphs when the original data are
        unavailable.


        Digitization tools such as WebPlotDigitizer make it possible to recover data from figures,
        and those recovered values may then be used to calculate effect sizes or contribute to
        meta-analyses. However, digitization is not perfectly error-free. The central concern
        motivating this dissertation is therefore not simply whether digitization error exists, but
        when that error is large enough to matter for statistical estimates and research
        conclusions. The project brings together my interests in simulation, measurement error,
        research synthesis, and the validity of methodological recommendations.
      contribution: >-
        This dissertation examines digitization error as a source of uncertainty in single-case
        experimental design research rather than treating extracted graph data as if they were
        observed without error. Its primary methodological contribution is to evaluate how
        digitization error propagates into effect size estimates and meta-analytic conclusions under
        different conditions. It also has a practical contribution: identifying circumstances in
        which graph digitization is sufficiently accurate for research synthesis and circumstances
        in which digitization error may meaningfully alter conclusions. More broadly, the study
        contributes to discussions of validity and reproducibility in research that relies on data
        reconstructed from published figures.
      chapters:
