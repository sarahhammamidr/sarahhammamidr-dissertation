name: Publish Knowledge Base

# Publishes the wiki/ Quarto site (the llm wiki + claim ledger + experiment
# registry) to GitHub Pages via the artifact flow. Neutral identity per the
# tokens-neutral-sibling ADR. No-ops cleanly when wiki/ has no content yet
# (fresh template repos: the knowledge base publishes once your AI assistant
# seeds wiki/ by running /ingest — see KNOWLEDGE.md).

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'research/literature/**'
      - 'experiments/**'
      - 'dataimago-spec.yaml'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_wiki: ${{ steps.gate.outputs.has_wiki }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for wiki content
        id: gate
        run: |
          if [ -f wiki/index.md ] && [ -f wiki/_quarto.yml ]; then
            echo "has_wiki=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wiki=false" >> "$GITHUB_OUTPUT"
            echo "No wiki content yet - skipping publish."
          fi

      - name: Setup Quarto
        if: steps.gate.outputs.has_wiki == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        if: steps.gate.outputs.has_wiki == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install chunk dependencies
        if: steps.gate.outputs.has_wiki == 'true'
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "yaml"))'

      - name: Render knowledge base
        if: steps.gate.outputs.has_wiki == 'true'
        run: |
          cd wiki
          quarto render

      - name: Upload Pages artifact
        if: steps.gate.outputs.has_wiki == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/_site

  deploy:
    needs: build-site
    if: needs.build-site.outputs.has_wiki == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
